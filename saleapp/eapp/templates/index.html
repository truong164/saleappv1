{% extends 'layout/base.html' %}

{% block content %}
<section>
    {% if products %}
    <div class="row">
        {% for p in products %}
        <div class="col-md-3 col-6">
            <div class="card" >
              <img class="card-img-top" src="{{ p.image }}" alt="Card image">
              <div class="card-body">
                <h4 class="card-title">{{ p.name }}</h4>
                <p class="card-text">{{ p.price }} VNĐ</p>
                <a href="#" class="btn btn-primary">Xem chi tiết</a>
                  <button class="bnt bnt-danger">Đặt hàng</button>
              </div>
            </div>
        </div>
        {% endfor %}
    </div>
    {% else%}
    <div class="alert alert-warning">KHÔNG có sản phẩm nào </div>
    {%endif%}
</section>
{% endblock%}
